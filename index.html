<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ic-mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kluvs</title>

    <!-- Resolve the theme before first paint so light-mode visitors don't see a dark flash.
         Mirrors resolveTheme() in src/contexts/ThemeContext.tsx. -->
    <script>
      try {
        var t = localStorage.getItem('kluvs-theme');
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>

    <meta name="description" content="Kluvs gives your book club a quiet place for the current read, the next discussion, and everything you meant to bring up. On Android, iPhone, and the web." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kluvs.com" />
    <meta property="og:site_name" content="Kluvs" />
    <meta property="og:title" content="Kluvs: Reading is done best together" />
    <meta property="og:description" content="Kluvs gives your book club a quiet place for the current read, the next discussion, and everything you meant to bring up. On Android, iPhone, and the web." />
    <meta property="og:image" content="https://kluvs.com/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Kluvs: Reading is done best together" />
    <meta property="twitter:description" content="Kluvs gives your book club a quiet place for the current read, the next discussion, and everything you meant to bring up. On Android, iPhone, and the web." />
    <meta property="twitter:image" content="https://kluvs.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0&display=swap" rel="stylesheet">

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
